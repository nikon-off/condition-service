spring:
  application:
    name: condition-service

  # Активный профиль по умолчанию; переопределяется через SPRING_PROFILES_ACTIVE
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Виртуальные потоки (Java 21+)
  threads:
    virtual:
      enabled: true

  # Не дать JVM завершиться, когда не остаётся платформенных потоков (нужно для виртуальных потоков)
  main:
    keep-alive: true

  datasource:
    url: jdbc:postgresql://localhost:5432/condition_service
    username: cs_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет Flyway, поэтому схему только валидируем
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.conditionservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # "always" — для dev-профиля (детали здоровых/больных компонентов).
      # В prod (application-prod.yml) переопределено на "never".
      show-details: always
      probes:
        # Включаем группы liveness/readiness вне Kubernetes (для K8s Probes):
        #   /actuator/health/liveness
        #   /actuator/health/readiness
        enabled: true
  info:
    env:
      enabled: true
    # Выводим полный git.properties (branch, commit.id, commit.time) в /actuator/info
    git:
      mode: full
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Сервис проверки условий отбора (Condition Checking Service)
    # Подставляется Maven'ом при сборке (@...@ фильтрация включена в spring-boot-starter-parent)
    version: @project.version@
    java-version: ${java.version}