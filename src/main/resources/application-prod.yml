# Продакшн: JSON-логирование, БД из окружения
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Подпрофиль "json" (structured JSON-логирование) активируется автоматически
  # через spring.profiles.group.prod=json в application.yml (Spring Boot 3).

logging:
  level:
    root: INFO
    com.conditionservice: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never