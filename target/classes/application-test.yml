# Тесты: PostgreSQL поднимается через Testcontainers (@ServiceConnection),
# поэтому datasource.url здесь не задаём — он приходит динамически.
spring:
  datasource:
    hikari:
      maximum-pool-size: 5

  flyway:
    enabled: true

logging:
  level:
    org.testcontainers: INFO
    com.conditionservice: DEBUG